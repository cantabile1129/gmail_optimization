[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-triage-lab"
version = "0.1.0"
description = "Privacy-conscious, read-only Gmail subscription triage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gmail = [
  "google-api-python-client",
  "google-auth-httplib2",
  "google-auth-oauthlib",
]

[project.scripts]
gmail-triage = "gmail_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
